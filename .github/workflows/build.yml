name: Build

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --verbose --release --target ${{ matrix.target }}

    - name: Compress binary (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        tar -czvf target/imgr-x86_64-linux.tar.gz -C target/x86_64-unknown-linux-gnu/release imgr

    - name: Compress binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        powershell Compress-Archive -Path target\x86_64-pc-windows-msvc\release\imgr.exe -DestinationPath target\imgr-x86_64-windows.zip

    - name: Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        files: |
          target/imgr-x86_64-linux.tar.gz
          target/imgr-x86_64-windows.zip